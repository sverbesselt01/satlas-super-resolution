# General Settings
name: infer_grid_example
model_type: SSRESRGANModel
scale: 4
num_gpu: auto
manual_seed: 0

# Inference Settings

# Root directory for low-res images you want super-resolved.
data_dir: G:/Mijn Drive/Deep resolution/satlas-super-resolution/data/Sentinel2_L2A_20230301/sentinel2/ #super_resolution_2023-12-08/test_set/sentinel2/

n_lr_images: 1

save_path: testing_infer_grid/

# Structure of the generator you want to use for inference
network_g:
  type: SSR_RRDBNet
  num_in_ch: 3 # 24  # number of Sentinel2 images * 3 channels (RGB)
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

# Load pretrained weights into the generator that is defined above
path:
  pretrain_network_g: experiments/esrgan_1S2.pth #experiments/sample_net_g.pth
  param_key_g: params_ema
  strict_load_g: true
